name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Serveur .NET (porte qualité)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, format, tests, couverture ≥ 80 %, dépendances
        run: server/eng/verify.sh
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-serveur
          path: server/artifacts/coverage
          if-no-files-found: ignore

  tooling:
    name: Outillage Trello (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -W error -m unittest discover -s scripts/trello -v

  mobile:
    name: Application Flutter (analyse et tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Couverture des lignes ≥ 80 %
        run: |
          python3 - coverage/lcov.info 80 <<'PY'
          import sys
          found = hit = 0
          for line in open(sys.argv[1]):
              if line.startswith("LF:"): found += int(line[3:])
              elif line.startswith("LH:"): hit += int(line[3:])
          coverage = 100 * hit / found if found else 100.0
          print(f"Couverture des lignes Dart : {coverage:.1f} % (minimum {sys.argv[2]} %)")
          sys.exit(0 if coverage >= float(sys.argv[2]) else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: couverture-mobile
          path: mobile/coverage/lcov.info

  mobile-dependencies:
    name: Application Flutter (dépendances vulnérables)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=mobile/pubspec.lock

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Actif dès que le secret SONAR_TOKEN est configuré (ADR-09) ; les PR de forks n'y ont pas accès.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'princemzb' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'princemzb_gestionSite' }}
    steps:
      - name: Jeton Sonar absent
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SONAR_TOKEN non configuré, analyse Sonar non exécutée (voir docs/dev/GUIDE.md)."
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        if: env.SONAR_TOKEN != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        if: env.SONAR_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Analyse et porte qualité Sonar (dépôt entier, C# et scripts)
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet tool restore
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.opencover.reportsPaths="server/artifacts/test-results/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="server/tests/**,scripts/**/test_*.py" \
            /d:sonar.exclusions="server/artifacts/**,**/bin/**,**/obj/**,mobile/**" \
            /d:sonar.python.coverage.reportPaths="coverage-python.xml"
          pip install --quiet --only-binary :all: coverage==7.6.10
          coverage run --source=scripts/trello --omit="*/test_*.py" -m unittest discover -s scripts/trello
          coverage xml -o coverage-python.xml
          dotnet build server/GestionSite.slnx --configuration Release
          dotnet test server/GestionSite.slnx --no-build --configuration Release \
            --collect:"XPlat Code Coverage" --results-directory server/artifacts/test-results \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  sonar-mobile:
    name: SonarQube Cloud (application Flutter)
    runs-on: ubuntu-latest
    needs: mobile
    timeout-minutes: 15
    # Projet Sonar distinct : le scanner .NET n'analyse pas le Dart (ADR-09).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Jeton Sonar absent
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SONAR_TOKEN non configuré, analyse Sonar de l'application Flutter non exécutée."
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: env.SONAR_TOKEN != ''
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - name: Dépendances Dart (requises par l'analyseur Sonar)
        if: env.SONAR_TOKEN != ''
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: couverture-mobile
          path: mobile/coverage
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        if: env.SONAR_TOKEN != ''
        with:
          projectBaseDir: mobile
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'princemzb' }}
            -Dsonar.projectKey=${{ vars.SONAR_MOBILE_PROJECT_KEY || 'princemzb_gestionSite_mobile' }}
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
